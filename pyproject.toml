[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-management-system"
version = "1.0.0"
description = "A Python console application for SQL Server employee administration"
authors = [{name = "Faraz Hussain"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.14.7"
dependencies = ["pyodbc==5.3.0", "SQLAlchemy==2.1.6"]

[project.urls]
Repository = "https://github.com/asteroidcrib729/employee-management-system"
Issues = "https://github.com/asteroidcrib729/employee-management-system/issues"

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
]

[project.scripts]
ems = "ems.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ems", "ems.sql"]

[tool.setuptools.package-data]
"ems.sql" = ["*.sql"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["ems"]

[tool.coverage.report]
fail_under = 85
show_missing = true
