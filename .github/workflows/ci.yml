name: Quality and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, configuration and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python scripts/validate_repository.py
      - run: uv run --locked python scripts/install_ci_tool.py actionlint
      - run: .local/ci-tools/actionlint
      - run: uv build
      - run: uv run --locked python scripts/validate_package.py
      - run: git diff --exit-code
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked coverage run -m unittest discover -s tests -v
      - run: uv run --locked coverage report
      - run: uv run --locked python -m ems --help
      - run: uv run --locked ems production --help
  sql-server:
    name: SQL Server LocalDB integration
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          enable-cache: true
      - run: uv sync --locked
      - name: Start a disposable instance of the preinstalled LocalDB engine
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $localDbExe = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source
          if (-not $localDbExe) {
            $localDbExe = @('170', '160', '150') | ForEach-Object {
              Join-Path $env:ProgramFiles "Microsoft SQL Server\$_\Tools\Binn\SqlLocalDB.exe"
            } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $localDbExe) { throw 'The hosted image has no LocalDB utility.' }
          $instanceName = "ems_ci_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"
          "EMS_LOCALDB_EXE=$localDbExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EMS_LOCALDB_INSTANCE=$instanceName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $localDbExe create $instanceName -s
          if ($LASTEXITCODE -ne 0) { throw 'Disposable LocalDB startup failed.' }
          $driver = uv run --locked python -c "import pyodbc; print(next((d for d in ('ODBC Driver 18 for SQL Server', 'ODBC Driver 17 for SQL Server') if d in pyodbc.drivers()), ''))"
          if ($LASTEXITCODE -ne 0 -or -not $driver) { throw 'A SQL Server ODBC driver is required.' }
          "EMS_TEST_SERVER_CONNECTION=DRIVER={$driver};SERVER=(localdb)\$instanceName;DATABASE=master;Trusted_Connection=yes;Encrypt=no;" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Wait for the disposable SQL Server
        timeout-minutes: 2
        shell: pwsh
        run: |
          @'
          import os, time, pyodbc
          for attempt in range(30):
              try:
                  connection = pyodbc.connect(os.environ['EMS_TEST_SERVER_CONNECTION'], timeout=2)
                  print('Disposable SQL Server version:', connection.execute('SELECT @@VERSION').fetchval())
                  connection.close()
                  break
              except pyodbc.Error:
                  if attempt == 29:
                      raise SystemExit('Disposable SQL Server did not become ready') from None
                  time.sleep(2)
          '@ | uv run --locked python -
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB readiness failed.' }
      - run: uv run --locked python -m unittest discover -s tests -p test_sql_server.py -v
      - name: Remove only this run's LocalDB instance
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          $expected = "ems_ci_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"
          if ($env:EMS_LOCALDB_EXE -and $env:EMS_LOCALDB_INSTANCE) {
            if ($env:EMS_LOCALDB_INSTANCE -cne $expected) { throw 'Refusing to clean up an unowned instance.' }
            & $env:EMS_LOCALDB_EXE stop $expected -k
            & $env:EMS_LOCALDB_EXE delete $expected
            if ($LASTEXITCODE -ne 0) { throw 'Disposable LocalDB deletion failed.' }
          }
